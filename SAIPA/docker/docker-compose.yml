services:
  postgres:
    image: postgres:14-alpine
    container_name: saipa-postgres
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle_dev_password
      POSTGRES_DB: moodle
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saipa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 5

  moodle:
    build:
      context: ./moodle
      dockerfile: Dockerfile
    container_name: saipa-moodle
    env_file:
      - moodle.env
    environment:
      MOODLE_DB_HOST: postgres
      MOODLE_DB_PORT: 5432
    ports:
      - "8080:80"
    volumes:
      - moodle_data:/var/www/html
      - moodle_data_persist:/var/www/moodledata
      # Mount plugins directly into Moodle's directory tree
      - ../moodle-plugins/local_saipa:/var/www/html/local/saipa
      - ../moodle-plugins/blocks/saipa:/var/www/html/blocks/saipa
      # message_saipa: disabled during initial install — enable after Moodle is running
      # - ../moodle-plugins/message/output/saipa:/var/www/html/message/output/saipa
    networks:
      - saipa-network
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  saipa-engine:
    build:
      context: ../saipa-engine
      dockerfile: ../docker/saipa-engine/Dockerfile
    container_name: saipa-saipa-engine
    env_file:
      - saipa-engine.env
    ports:
      - "8052:8052"
    volumes:
      - saipa_engine_chroma:/app/chroma_data
    networks:
      - saipa-network
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para alcanzar Ollama en el host

volumes:
  postgres_data:
  moodle_data:
  moodle_data_persist:
  saipa_engine_chroma:

networks:
  saipa-network:
    driver: bridge
